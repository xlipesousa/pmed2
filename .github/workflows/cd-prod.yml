name: CD Produção

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag validada em homolog (ex.: v1.2.3)"
        required: true
        type: string

jobs:
  deploy-producao:
    name: Deploy em Produção
    runs-on: [self-hosted, Linux, X64, pmed2-interno]
    environment: production

    steps:
      - name: Checkout da tag informada
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validar formato da tag
        run: |
          set -euo pipefail
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag inválida. Use o formato vX.Y.Z";
            exit 1;
          }

      - name: Validar pré-requisitos do runner
        run: |
          set -euo pipefail
          command -v php
          command -v composer
          command -v zip
          command -v ssh
          command -v scp
          php -v
          composer --version

      - name: Install deps (release)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Build zip da tag
        run: |
          set -euo pipefail
          mkdir -p build
          zip -rq "build/pmed2-${{ inputs.tag }}.zip" . \
            -x ".git/*" "node_modules/*" "storage/logs/*" "storage/framework/*"

      - name: Preparar chave SSH de produção
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/pmed2_prod <<'EOF'
          ${{ secrets.PMED2_PROD_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/pmed2_prod
          ssh-keyscan -H "${{ secrets.PMED2_PROD_SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Testar SSH (produção)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_prod -o BatchMode=yes -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" "hostname && whoami"

      - name: Enviar zip para produção
        run: |
          set -euo pipefail
          scp -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes build/*.zip "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}:/tmp/"

      - name: Enviar scripts para produção
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" "mkdir -p /tmp/pmed2-scripts/scripts"
          scp -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes scripts/deploy.sh scripts/rollback.sh scripts/backup.sh "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}:/tmp/pmed2-scripts/scripts/"

      - name: Calcular hashes locais dos scripts
        id: local_hashes
        run: |
          set -euo pipefail
          echo "deploy_sha=$(sha256sum scripts/deploy.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "rollback_sha=$(sha256sum scripts/rollback.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "backup_sha=$(sha256sum scripts/backup.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Instalar scripts na pasta shared (produção)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" '
            set -euo pipefail
            mkdir -p /var/www/pmed2/shared/scripts
            cp -f /tmp/pmed2-scripts/scripts/deploy.sh /var/www/pmed2/shared/scripts/deploy.sh
            cp -f /tmp/pmed2-scripts/scripts/rollback.sh /var/www/pmed2/shared/scripts/rollback.sh
            cp -f /tmp/pmed2-scripts/scripts/backup.sh /var/www/pmed2/shared/scripts/backup.sh
            chmod 755 /var/www/pmed2/shared/scripts/deploy.sh /var/www/pmed2/shared/scripts/rollback.sh /var/www/pmed2/shared/scripts/backup.sh
          '

      - name: Validar scripts remotos (auditoria)
        run: |
          set -euo pipefail
          expected_deploy='${{ steps.local_hashes.outputs.deploy_sha }}'
          expected_rollback='${{ steps.local_hashes.outputs.rollback_sha }}'
          expected_backup='${{ steps.local_hashes.outputs.backup_sha }}'

          remote_output="$(ssh -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" '
            set -euo pipefail
            ls -l /var/www/pmed2/shared/scripts
            echo "DEPLOY=$(sha256sum /var/www/pmed2/shared/scripts/deploy.sh | cut -d" " -f1)"
            echo "ROLLBACK=$(sha256sum /var/www/pmed2/shared/scripts/rollback.sh | cut -d" " -f1)"
            echo "BACKUP=$(sha256sum /var/www/pmed2/shared/scripts/backup.sh | cut -d" " -f1)"
          ')"

          remote_deploy="$(echo "$remote_output" | awk -F= '/^DEPLOY=/{print $2}')"
          remote_rollback="$(echo "$remote_output" | awk -F= '/^ROLLBACK=/{print $2}')"
          remote_backup="$(echo "$remote_output" | awk -F= '/^BACKUP=/{print $2}')"

          [[ "$remote_deploy" == "$expected_deploy" ]] || { echo "Hash mismatch: deploy.sh"; exit 1; }
          [[ "$remote_rollback" == "$expected_rollback" ]] || { echo "Hash mismatch: rollback.sh"; exit 1; }
          [[ "$remote_backup" == "$expected_backup" ]] || { echo "Hash mismatch: backup.sh"; exit 1; }
          echo "Integridade ponta a ponta validada (runner x produção)."

      - name: Executar deploy remoto (produção)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" "/var/www/pmed2/shared/scripts/deploy.sh '${{ inputs.tag }}'"

      - name: Healthcheck pós-deploy (produção)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" '
            set -euo pipefail
            curl -fsS http://127.0.0.1/health >/dev/null
            curl -I http://127.0.0.1/login | head -n 1
          '
