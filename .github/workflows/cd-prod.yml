name: CD Produção

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      tag:
        description: "Tag validada em homolog (ex.: v1.2.3)"
        required: true
        type: string
      rollback_tag:
        description: "Tag alvo para rollback manual (ex.: v1.2.2). Usada quando mode=rollback"
        required: false
        type: string

jobs:
  deploy-producao:
    name: Deploy em Produção
    runs-on: [self-hosted, Linux, X64, pmed2-interno]
    environment: production
    env:
      TARGET_TAG: ${{ inputs.mode == 'rollback' && inputs.rollback_tag || inputs.tag }}

    steps:
      - name: Resolver parâmetros de deploy/rollback
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "rollback" ] && [ -z "${{ inputs.rollback_tag }}" ]; then
            echo "rollback_tag é obrigatório quando mode=rollback"
            exit 1
          fi
          echo "Modo: ${{ inputs.mode }}"
          echo "Tag alvo: ${TARGET_TAG}"

      - name: Checkout da tag alvo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_TAG }}

      - name: Validar formato da tag
        run: |
          set -euo pipefail
          [[ "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag inválida. Use o formato vX.Y.Z";
            exit 1;
          }

      - name: Validar tag x versão declarada
        run: |
          set -euo pipefail
          APP_VERSION="$(grep -E '"version"\s*:\s*"[0-9]+\.[0-9]+\.[0-9]+"' composer.json | head -n1 | sed -E 's/.*"version"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')"
          if [ -z "$APP_VERSION" ]; then
            echo "composer.json sem campo version."
            exit 1
          fi

          TAG_VERSION="${TARGET_TAG}"
          TAG_VERSION="${TAG_VERSION#v}"

          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag (${TAG_VERSION}) difere da versão declarada (${APP_VERSION})."
            exit 1
          fi

          echo "Tag e versão declarada estão alinhadas: ${APP_VERSION}"

      - name: Validar pré-requisitos do runner
        run: |
          set -euo pipefail
          command -v ssh
          command -v scp

      - name: Preparar chave SSH de produção
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.PMED2_PROD_SSH_KNOWN_HOSTS }}" ]; then
            echo "Secret PMED2_PROD_SSH_KNOWN_HOSTS não definido. Configure a entrada pinada de known_hosts."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/pmed2_prod <<'EOF'
          ${{ secrets.PMED2_PROD_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/pmed2_prod
          printf '%s\n' "${{ secrets.PMED2_PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Testar SSH (produção)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_prod -o BatchMode=yes -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" "hostname && whoami"

      - name: Validar segredo DB (produção)
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.PMED2_PROD_DB_PASSWORD }}" ]; then
            echo "Secret PMED2_PROD_DB_PASSWORD não definido."
            exit 1
          fi

      - name: Enviar arquivos de compose para produção
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" '
            set -euo pipefail
            mkdir -p /var/www/pmed2/deploy /var/www/pmed2/docker/nginx /var/www/pmed2/shared/compose /var/www/pmed2/shared/secrets
          '
          scp -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes deploy/compose.prod.yml "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}:/var/www/pmed2/deploy/compose.prod.yml"
          scp -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes docker/nginx/default.conf "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}:/var/www/pmed2/docker/nginx/default.conf"

      - name: Instalar segredo DB por arquivo (produção)
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.PMED2_PROD_DB_PASSWORD }}" | \
            ssh -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" '
              set -euo pipefail
              umask 077
              cat > /var/www/pmed2/shared/secrets/db_password
              chmod 600 /var/www/pmed2/shared/secrets/db_password
            '

      - name: Deploy docker compose (produção) com rollback automático
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" "TAG='${TARGET_TAG}' GHCR_USER='${{ secrets.PMED2_PROD_GHCR_USER }}' GHCR_TOKEN='${{ secrets.PMED2_PROD_GHCR_TOKEN }}' bash -s" <<'EOSSH'
          set -euo pipefail

          APP_BASE="/var/www/pmed2"
          COMPOSE_FILE="$APP_BASE/deploy/compose.prod.yml"
          SHARED_ENV="$APP_BASE/shared/.env"
          COMPOSE_ENV_DIR="$APP_BASE/shared/compose"
          COMPOSE_ENV_FILE="$COMPOSE_ENV_DIR/.env.prod"
          CURRENT_TAG_FILE="$COMPOSE_ENV_DIR/current_tag"
          PREVIOUS_TAG_FILE="$COMPOSE_ENV_DIR/previous_tag"
          NEW_TAG="$TAG"
          IMAGE_NAME="ghcr.io/xlipesousa/pmed2"

          mkdir -p "$COMPOSE_ENV_DIR"

          read_env() {
            local key="$1"
            local default_value="${2:-}"
            local value
            value="$(grep -E "^${key}=" "$SHARED_ENV" | tail -n1 | cut -d'=' -f2- || true)"
            value="${value%\"}"
            value="${value#\"}"
            value="${value%\'}"
            value="${value#\'}"
            if [ -z "$value" ]; then
              value="$default_value"
            fi
            printf '%s' "$value"
          }

          CURRENT_TAG=""
          if [ -s "$CURRENT_TAG_FILE" ]; then
            CURRENT_TAG="$(cat "$CURRENT_TAG_FILE")"
          fi

          if [ -n "$CURRENT_TAG" ] && [ "$CURRENT_TAG" != "$NEW_TAG" ]; then
            echo "$CURRENT_TAG" > "$PREVIOUS_TAG_FILE"
          fi

          rollback() {
            local prev
            if [ -s "$PREVIOUS_TAG_FILE" ]; then
              prev="$(cat "$PREVIOUS_TAG_FILE")"
              echo "Falha detectada. Aplicando rollback para ${prev}"
              sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=${prev}#" "$COMPOSE_ENV_FILE"
              docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" pull
              docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans
              echo "$prev" > "$CURRENT_TAG_FILE"
            else
              echo "Sem tag anterior registrada para rollback automático."
            fi
          }

          trap 'rollback' ERR

          APP_URL="$(read_env APP_URL http://localhost)"
          DB_HOST="$(read_env DB_HOST 127.0.0.1)"
          DB_PORT="$(read_env DB_PORT 3306)"
          DB_DATABASE="$(read_env DB_DATABASE pmed2)"
          DB_USERNAME="$(read_env DB_USERNAME pmed2)"

          {
            printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME"
            printf 'IMAGE_TAG=%s\n' "$NEW_TAG"
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'APP_DEBUG=false\n'
            printf 'APP_HTTP_PORT=80\n'
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_DATABASE=%s\n' "$DB_DATABASE"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD_SECRET_FILE=/var/www/pmed2/shared/secrets/db_password\n'
          } > "$COMPOSE_ENV_FILE"

          if [ -n "${GHCR_USER:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi

          docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" pull
          docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans

          curl -fsS http://127.0.0.1/health >/dev/null

          echo "$NEW_TAG" > "$CURRENT_TAG_FILE"
          echo "Deploy produção concluído com sucesso: $NEW_TAG"
          EOSSH

      - name: Healthcheck pós-deploy (produção)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_prod -o StrictHostKeyChecking=yes "${{ secrets.PMED2_PROD_SSH_USER }}@${{ secrets.PMED2_PROD_SSH_HOST }}" '
            set -euo pipefail
            curl -fsS http://127.0.0.1/health >/dev/null
            curl -I http://127.0.0.1/login | head -n 1
          '

      - name: Limpar material SSH sensível (produção)
        if: always()
        run: |
          set -euo pipefail
          rm -f ~/.ssh/pmed2_prod
          rm -f ~/.ssh/known_hosts
