name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Validar versão semântica do app
        run: |
          set -euo pipefail
          APP_VERSION="$(php -r '$c=json_decode(file_get_contents("composer.json"), true); echo $c["version"] ?? "";')"
          if [ -z "$APP_VERSION" ]; then
            echo "composer.json sem campo version."
            exit 1
          fi

          if ! echo "$APP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Versão inválida em composer.json: $APP_VERSION (esperado MAJOR.MINOR.PATCH)"
            exit 1
          fi

          echo "Versão semântica válida: $APP_VERSION"

      - name: Install deps (com dev)
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Preparar ambiente de teste
        run: |
          cp .env.example .env
          APP_KEY_VALUE="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          if grep -q '^APP_KEY=' .env; then
            sed -i "s#^APP_KEY=.*#APP_KEY=${APP_KEY_VALUE}#" .env
          else
            echo "APP_KEY=${APP_KEY_VALUE}" >> .env
          fi

      - name: Testes
        run: vendor/bin/phpunit

      - name: PHPStan/Larastan
        run: |
          if [ -x vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --memory-limit=1G
          else
            echo "PHPStan não instalado no projeto; etapa ignorada."
          fi

      - name: Composer audit
        run: |
          if ! composer audit; then
            echo "::warning::Composer audit encontrou vulnerabilidades. Revisar e atualizar dependências."
          fi

  package:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install deps (release)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Build zip de release
        run: |
          REF="${GITHUB_REF_NAME:-$GITHUB_SHA}"
          mkdir -p build
          zip -rq "build/pmed2-${REF}.zip" . \
            -x ".git/*" "node_modules/*" "storage/logs/*" "storage/framework/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmed2-${{ github.ref_name }}
          path: build/*.zip
          retention-days: 10
