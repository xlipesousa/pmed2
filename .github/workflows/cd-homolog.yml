name: CD Homolog

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy-homolog:
    name: Deploy em Homolog
    runs-on: [self-hosted, Linux, X64, pmed2-interno]
    environment: homolog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar tag x versão declarada
        run: |
          set -euo pipefail
          APP_VERSION="$(grep -E '"version"\s*:\s*"[0-9]+\.[0-9]+\.[0-9]+"' composer.json | head -n1 | sed -E 's/.*"version"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')"
          if [ -z "$APP_VERSION" ]; then
            echo "composer.json sem campo version."
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag (${GITHUB_REF_NAME}) difere da versão declarada (${APP_VERSION})."
            exit 1
          fi

          echo "Tag e versão declarada estão alinhadas: ${APP_VERSION}"

      - name: Validar pré-requisitos do runner
        run: |
          set -euo pipefail
          command -v ssh
          command -v scp

      - name: Preparar chave SSH de homolog
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.PMED2_HOM_SSH_KNOWN_HOSTS }}" ]; then
            echo "Secret PMED2_HOM_SSH_KNOWN_HOSTS não definido. Configure a entrada pinada de known_hosts."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/pmed2_homolog <<'EOF'
          ${{ secrets.PMED2_HOM_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/pmed2_homolog
          # Arquivo próprio do job: o ~/.ssh/known_hosts do runner self-hosted é compartilhado
          # entre execuções e pertence ao usuário do runner — sobrescrevê-lo (e apagá-lo no
          # cleanup) era efeito colateral indevido sobre outros jobs.
          printf '%s\n' "${{ secrets.PMED2_HOM_SSH_KNOWN_HOSTS }}" > ~/.ssh/pmed2_homolog_known_hosts
          chmod 644 ~/.ssh/pmed2_homolog_known_hosts

      - name: Testar SSH (homolog)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_homolog -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/pmed2_homolog_known_hosts "${{ secrets.PMED2_HOM_SSH_USER }}@${{ secrets.PMED2_HOM_SSH_HOST }}" "hostname && whoami"

      - name: Validar segredo DB (homolog)
        env:
          DB_PASSWORD: ${{ secrets.PMED2_HOM_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DB_PASSWORD}" ]; then
            echo "Secret PMED2_HOM_DB_PASSWORD não definido."
            exit 1
          fi

      - name: Enviar arquivos de compose para homolog
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_homolog -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/pmed2_homolog_known_hosts "${{ secrets.PMED2_HOM_SSH_USER }}@${{ secrets.PMED2_HOM_SSH_HOST }}" '
            set -euo pipefail
            mkdir -p /var/www/pmed2/deploy /var/www/pmed2/docker/nginx /var/www/pmed2/shared/compose /var/www/pmed2/shared/secrets
          '
          scp -i ~/.ssh/pmed2_homolog -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/pmed2_homolog_known_hosts deploy/compose.homolog.yml "${{ secrets.PMED2_HOM_SSH_USER }}@${{ secrets.PMED2_HOM_SSH_HOST }}:/var/www/pmed2/deploy/compose.homolog.yml"
          scp -i ~/.ssh/pmed2_homolog -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/pmed2_homolog_known_hosts docker/nginx/default.conf "${{ secrets.PMED2_HOM_SSH_USER }}@${{ secrets.PMED2_HOM_SSH_HOST }}:/var/www/pmed2/docker/nginx/default.conf"

      - name: Instalar segredo DB por arquivo (homolog)
        env:
          DB_PASSWORD: ${{ secrets.PMED2_HOM_DB_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "${DB_PASSWORD}" | \
            ssh -i ~/.ssh/pmed2_homolog -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/pmed2_homolog_known_hosts "${{ secrets.PMED2_HOM_SSH_USER }}@${{ secrets.PMED2_HOM_SSH_HOST }}" '
              set -euo pipefail
              umask 077
              cat > /var/www/pmed2/shared/secrets/db_password
              chmod 600 /var/www/pmed2/shared/secrets/db_password
            '

      - name: Deploy docker compose (homolog) com rollback automático
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_homolog -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/pmed2_homolog_known_hosts "${{ secrets.PMED2_HOM_SSH_USER }}@${{ secrets.PMED2_HOM_SSH_HOST }}" "TAG='${{ github.ref_name }}' GHCR_USER='${{ secrets.PMED2_HOM_GHCR_USER }}' GHCR_TOKEN='${{ secrets.PMED2_HOM_GHCR_TOKEN }}' bash -s" <<'EOSSH'
          set -euo pipefail

          APP_BASE="/var/www/pmed2"
          COMPOSE_FILE="$APP_BASE/deploy/compose.homolog.yml"
          # Fixo: sem isso, o nome do projeto (que prefixa volumes/rede) vem do
          # diretório de trabalho da sessão SSH, que pode variar entre execuções -
          # trocaria os volumes nomeados a cada deploy em vez de reaproveitá-los.
          export COMPOSE_PROJECT_NAME="pmed2"
          SHARED_ENV="$APP_BASE/shared/.env"
          COMPOSE_ENV_DIR="$APP_BASE/shared/compose"
          COMPOSE_ENV_FILE="$COMPOSE_ENV_DIR/.env.homolog"
          CURRENT_TAG_FILE="$COMPOSE_ENV_DIR/current_tag"
          PREVIOUS_TAG_FILE="$COMPOSE_ENV_DIR/previous_tag"
          NEW_TAG="$TAG"
          IMAGE_NAME="ghcr.io/xlipesousa/pmed2"
          # O nginx do host serve a porta 80 e faz proxy reverso para esta porta.
          # O compose publica em 127.0.0.1:${APP_HTTP_PORT}, nunca em 0.0.0.0.
          APP_HTTP_PORT="8080"

          mkdir -p "$COMPOSE_ENV_DIR"

          read_env() {
            local key="$1"
            local default_value="${2:-}"
            local value
            value="$(grep -E "^${key}=" "$SHARED_ENV" | tail -n1 | cut -d'=' -f2- || true)"
            value="${value%\"}"
            value="${value#\"}"
            value="${value%\'}"
            value="${value#\'}"
            if [ -z "$value" ]; then
              value="$default_value"
            fi
            printf '%s' "$value"
          }

          CURRENT_TAG=""
          if [ -s "$CURRENT_TAG_FILE" ]; then
            CURRENT_TAG="$(cat "$CURRENT_TAG_FILE")"
          fi

          if [ -n "$CURRENT_TAG" ] && [ "$CURRENT_TAG" != "$NEW_TAG" ]; then
            echo "$CURRENT_TAG" > "$PREVIOUS_TAG_FILE"
          fi

          rollback() {
            local prev
            if [ -s "$PREVIOUS_TAG_FILE" ]; then
              prev="$(cat "$PREVIOUS_TAG_FILE")"
              echo "Falha detectada. Aplicando rollback para ${prev}"
              sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=${prev}#" "$COMPOSE_ENV_FILE"
              docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" pull
              docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans
              echo "$prev" > "$CURRENT_TAG_FILE"
            else
              echo "Sem tag anterior registrada para rollback automático."
            fi
          }

          trap 'rollback' ERR

          APP_URL="$(read_env APP_URL http://localhost)"
          # A imagem não contém .env (excluído pelo .dockerignore) e o compose não tinha APP_KEY:
          # sem propagar a chave existente do servidor, o Laravel sobe sem chave de criptografia
          # estável. Tem que ser a MESMA chave — gerar uma nova invalida sessões e torna ilegível
          # qualquer dado encriptado já persistido no banco.
          APP_KEY="$(read_env APP_KEY '')"
          if [ -z "$APP_KEY" ]; then
            echo "APP_KEY ausente em $SHARED_ENV. Abortando: gerar uma chave nova invalidaria sessões e dados encriptados."
            # 'exit N' não dispara a trap ERR (só falha de comando comum dispara) - chamar
            # rollback explicitamente aqui, senão essa saída passa batido sem restaurar nada.
            rollback
            exit 1
          fi
          # host.docker.internal + extra_hosts no compose: dentro do container, 127.0.0.1 seria o
          # próprio container, não o MySQL do host.
          DB_HOST="$(read_env DB_HOST host.docker.internal)"
          if [ "$DB_HOST" = "127.0.0.1" ] || [ "$DB_HOST" = "localhost" ]; then
            DB_HOST="host.docker.internal"
          fi
          DB_PORT="$(read_env DB_PORT 3306)"
          DB_DATABASE="$(read_env DB_DATABASE pmed2)"
          DB_USERNAME="$(read_env DB_USERNAME pmed2)"

          {
            printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME"
            printf 'IMAGE_TAG=%s\n' "$NEW_TAG"
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'APP_KEY=%s\n' "$APP_KEY"
            printf 'APP_DEBUG=false\n'
            # 8080 e não 80: o nginx do host ocupa a 80 e faz proxy reverso para cá.
            printf 'APP_HTTP_PORT=%s\n' "$APP_HTTP_PORT"
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_DATABASE=%s\n' "$DB_DATABASE"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD_SECRET_FILE=/var/www/pmed2/shared/secrets/db_password\n'
          } > "$COMPOSE_ENV_FILE"
          chmod 600 "$COMPOSE_ENV_FILE"

          if [ -n "${GHCR_USER:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi

          # docker-build.yml e cd-homolog.yml disparam em paralelo na mesma tag (não há needs/
          # workflow_run entre eles), então a imagem pode ainda não estar no GHCR quando chegamos
          # aqui. Sem retry, o primeiro pull falha e o trap ERR dispara um rollback desnecessário.
          pull_ok=false
          for tentativa in 1 2 3 4 5 6; do
            if docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" pull; then
              pull_ok=true
              break
            fi
            echo "pull falhou (tentativa ${tentativa}/6) - imagem pode ainda estar sendo publicada; aguardando 20s"
            sleep 20
          done
          if [ "$pull_ok" != "true" ]; then
            echo "Não foi possível baixar ${IMAGE_NAME}:${NEW_TAG} após 6 tentativas."
            # 'exit N' não dispara a trap ERR - chamar rollback explicitamente.
            rollback
            exit 1
          fi

          docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans

          # Healthcheck na porta do CONTAINER, não na 80: na 80 quem responde é o nginx bare-metal
          # do host, o que daria um falso-positivo validando o ambiente antigo.
          # Com retry porque app-init precisa copiar o código e o php-fpm precisa subir — sem
          # espera, o trap ERR dispara rollback mesmo quando o deploy está correto.
          health_ok=false
          for tentativa in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${APP_HTTP_PORT}/health" >/dev/null 2>&1; then
              health_ok=true
              echo "Healthcheck OK na tentativa ${tentativa}."
              break
            fi
            sleep 5
          done
          if [ "$health_ok" != "true" ]; then
            echo "Healthcheck falhou após 150s. Logs recentes:"
            docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" logs --tail=50 app web || true
            # 'exit N' não dispara a trap ERR - chamar rollback explicitamente.
            rollback
            exit 1
          fi

          # /health devolve JSON estático e não toca no banco - passa mesmo com o DB inacessível.
          # migrate:status é a prova real de conectividade.
          if ! docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" exec -T app php artisan migrate:status >/dev/null 2>&1; then
            echo "Aplicação responde, mas não alcança o banco (migrate:status falhou)."
            docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" exec -T app php artisan migrate:status || true
            # 'exit N' não dispara a trap ERR - chamar rollback explicitamente.
            rollback
            exit 1
          fi
          echo "Conectividade com o banco confirmada via migrate:status."

          echo "$NEW_TAG" > "$CURRENT_TAG_FILE"
          echo "Deploy homolog concluído com sucesso: $NEW_TAG"
          EOSSH

      - name: Healthcheck pós-deploy (homolog)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pmed2_homolog -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/pmed2_homolog_known_hosts "${{ secrets.PMED2_HOM_SSH_USER }}@${{ secrets.PMED2_HOM_SSH_HOST }}" '
            set -euo pipefail
            APP_HTTP_PORT=8080
            # Sempre a porta do container: na 80 responde o nginx bare-metal do host.
            curl -fsS "http://127.0.0.1:${APP_HTTP_PORT}/health" >/dev/null
            # -fsS em vez de -I: "curl -I" não falha em HTTP 500, então validava um erro como sucesso.
            # O grep no csrf-token prova que o Blade renderizou e a sessão funciona.
            curl -fsS "http://127.0.0.1:${APP_HTTP_PORT}/login" | grep -q "csrf-token"
            echo "Healthcheck pós-deploy OK (health + login renderizado)."
          '

      - name: Limpar material SSH sensível (homolog)
        if: always()
        run: |
          set -euo pipefail
          # Remove apenas o material deste job. O known_hosts do runner é compartilhado entre
          # execuções e pertence ao usuário do runner - apagá-lo era efeito colateral indevido.
          rm -f ~/.ssh/pmed2_homolog
          rm -f ~/.ssh/pmed2_homolog_known_hosts
