services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-pmed2-local}:${IMAGE_TAG:-dev}
    pull_policy: never
    container_name: pmed2-app
    restart: unless-stopped
    user: "0:0"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:?APP_KEY obrigatório - gere com php artisan key:generate e copie do .env}
      APP_URL: ${APP_URL:-http://localhost:${APP_HTTP_PORT:-8080}}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-pmed2}
      DB_USERNAME: ${DB_USERNAME:-pmed2}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    secrets:
      - db_password
    networks:
      - pmed2

  web:
    image: nginx:1.27-alpine
    container_name: pmed2-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - pmed2

  queue:
    image: ${IMAGE_NAME:-pmed2-local}:${IMAGE_TAG:-dev}
    pull_policy: never
    container_name: pmed2-queue
    restart: unless-stopped
    user: "0:0"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:?APP_KEY obrigatório - gere com php artisan key:generate e copie do .env}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-pmed2}
      DB_USERNAME: ${DB_USERNAME:-pmed2}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_MIGRATIONS: "false"
      RUN_STORAGE_LINK: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    secrets:
      - db_password
    volumes:
      - ./:/var/www/html
    networks:
      - pmed2

  scheduler:
    image: ${IMAGE_NAME:-pmed2-local}:${IMAGE_TAG:-dev}
    pull_policy: never
    container_name: pmed2-scheduler
    restart: unless-stopped
    user: "0:0"
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:?APP_KEY obrigatório - gere com php artisan key:generate e copie do .env}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-pmed2}
      DB_USERNAME: ${DB_USERNAME:-pmed2}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_MIGRATIONS: "false"
      RUN_STORAGE_LINK: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    secrets:
      - db_password
    volumes:
      - ./:/var/www/html
    networks:
      - pmed2

  db:
    image: mariadb:11
    container_name: pmed2-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-pmed2}
      MARIADB_USER: ${DB_USERNAME:-pmed2}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - pmed2_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/secrets/db_root_password)\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    secrets:
      - db_password
      - db_root_password
    networks:
      - pmed2

  redis:
    image: redis:7-alpine
    container_name: pmed2-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pmed2_redis_data:/data
    ports:
      - "${REDIS_FORWARD_PORT:-6380}:6379"
    networks:
      - pmed2

  vite:
    image: node:20-alpine
    container_name: pmed2-vite
    working_dir: /var/www/html
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    profiles: ["dev"]
    networks:
      - pmed2

networks:
  pmed2:

volumes:
  pmed2_db_data:
  pmed2_redis_data:

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-./.secrets/db_password}
  db_root_password:
    file: ${DB_ROOT_PASSWORD_SECRET_FILE:-./.secrets/db_root_password}
