services:
  app-init:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-app-init-prod
    command: ["sh", "-c", "rm -rf /srv/app/* && cp -a /var/www/html/. /srv/app/"]
    volumes:
      - pmed2_app_code_prod:/srv/app
    restart: "no"
    networks:
      - pmed2

  app:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-app-prod
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY obrigatório}
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL obrigatório}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?DB_HOST obrigatório}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE obrigatório}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME obrigatório}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    # NÃO usar "host-gateway": esse valor mágico resolve para o gateway da
    # bridge PADRÃO (docker0), não para a rede custom "pmed2" em que este
    # container está - ver o mesmo problema confirmado ao vivo em homolog,
    # registrado em planos/guia-decisoes-producao.md ADR-08. Como a subnet da
    # rede pmed2 já é fixa (ver networks.pmed2 mais abaixo), aponta direto
    # pro gateway real.
    extra_hosts:
      - "host.docker.internal:10.219.20.1"
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - pmed2_app_code_prod:/var/www/html
    secrets:
      - db_password
    networks:
      - pmed2

  web:
    image: nginx:1.27-alpine
    container_name: pmed2-web-prod
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-80}:80"
    volumes:
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - pmed2_app_code_prod:/var/www/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - pmed2

  queue:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-queue-prod
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY obrigatório}
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?DB_HOST obrigatório}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE obrigatório}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME obrigatório}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RUN_MIGRATIONS: "false"
      RUN_STORAGE_LINK: "false"
    # NÃO usar "host-gateway": esse valor mágico resolve para o gateway da
    # bridge PADRÃO (docker0), não para a rede custom "pmed2" em que este
    # container está - ver o mesmo problema confirmado ao vivo em homolog,
    # registrado em planos/guia-decisoes-producao.md ADR-08. Como a subnet da
    # rede pmed2 já é fixa (ver networks.pmed2 mais abaixo), aponta direto
    # pro gateway real.
    extra_hosts:
      - "host.docker.internal:10.219.20.1"
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - pmed2_app_code_prod:/var/www/html
    secrets:
      - db_password
    networks:
      - pmed2

  scheduler:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-scheduler-prod
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY obrigatório}
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?DB_HOST obrigatório}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE obrigatório}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME obrigatório}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_SCHEDULE_TIME: ${BACKUP_SCHEDULE_TIME:-02:00}
      BACKUP_DIR: ${BACKUP_DIR:-/var/www/html/storage/app/backups}
      RUN_MIGRATIONS: "false"
      RUN_STORAGE_LINK: "false"
    # NÃO usar "host-gateway": esse valor mágico resolve para o gateway da
    # bridge PADRÃO (docker0), não para a rede custom "pmed2" em que este
    # container está - ver o mesmo problema confirmado ao vivo em homolog,
    # registrado em planos/guia-decisoes-producao.md ADR-08. Como a subnet da
    # rede pmed2 já é fixa (ver networks.pmed2 mais abaixo), aponta direto
    # pro gateway real.
    extra_hosts:
      - "host.docker.internal:10.219.20.1"
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - pmed2_app_code_prod:/var/www/html
    secrets:
      - db_password
    networks:
      - pmed2

  redis:
    image: redis:7-alpine
    container_name: pmed2-redis-prod
    restart: unless-stopped
    volumes:
      - pmed2_redis_prod:/data
    networks:
      - pmed2

# Rede externa, criada pelo provisionamento ANTES do primeiro deploy:
# "docker network create --subnet=10.219.20.0/24 pmed2-prod-net". Precisa
# existir de antemão porque o MySQL do host faz bind no gateway dessa rede
# (10.219.20.1) - ver o mesmo raciocínio em deploy/compose.homolog.yml e
# planos/guia-decisoes-producao.md ADR-08. Diferente da subnet de homolog
# (10.219.10.0/24) por higiene, mesmo em servidores separados.
networks:
  pmed2:
    external: true
    name: pmed2-prod-net

volumes:
  pmed2_app_code_prod:
  pmed2_redis_prod:

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-/var/www/pmed2/shared/secrets/db_password}
