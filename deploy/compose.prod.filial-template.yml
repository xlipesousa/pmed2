services:
  app-init:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-app-init-${FILIAL_ID:?FILIAL_ID obrigatório}
    command: ["sh", "-c", "rm -rf /srv/app/* && cp -a /var/www/html/. /srv/app/"]
    volumes:
      - pmed2_app_code:/srv/app
    restart: "no"
    networks:
      - pmed2

  app:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-app-${FILIAL_ID:?FILIAL_ID obrigatório}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL obrigatório}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?DB_HOST obrigatório}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE obrigatório}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME obrigatório}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - pmed2_app_code:/var/www/html
    secrets:
      - db_password
    networks:
      - pmed2

  web:
    image: nginx:1.27-alpine
    container_name: pmed2-web-${FILIAL_ID:?FILIAL_ID obrigatório}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_HTTP_PORT:-80}:80"
    volumes:
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - pmed2_app_code:/var/www/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - pmed2

  queue:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-queue-${FILIAL_ID:?FILIAL_ID obrigatório}
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?DB_HOST obrigatório}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE obrigatório}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME obrigatório}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RUN_MIGRATIONS: "false"
      RUN_STORAGE_LINK: "false"
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - pmed2_app_code:/var/www/html
    secrets:
      - db_password
    networks:
      - pmed2

  scheduler:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-scheduler-${FILIAL_ID:?FILIAL_ID obrigatório}
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?DB_HOST obrigatório}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE obrigatório}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME obrigatório}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RUN_MIGRATIONS: "false"
      RUN_STORAGE_LINK: "false"
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - pmed2_app_code:/var/www/html
    secrets:
      - db_password
    networks:
      - pmed2

  redis:
    image: redis:7-alpine
    container_name: pmed2-redis-${FILIAL_ID:?FILIAL_ID obrigatório}
    restart: unless-stopped
    volumes:
      - pmed2_redis_data:/data
    networks:
      - pmed2

networks:
  pmed2:

volumes:
  pmed2_app_code:
  pmed2_redis_data:

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-/var/www/pmed2/shared/secrets/db_password}
