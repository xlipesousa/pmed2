services:
  app-init:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-app-init-homolog
    command: ["sh", "-c", "rm -rf /srv/app/* && cp -a /var/www/html/. /srv/app/"]
    volumes:
      - pmed2_app_code_homolog:/srv/app
    restart: "no"
    networks:
      - pmed2

  app:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-app-homolog
    restart: unless-stopped
    user: "0:0"
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY obrigatório}
      APP_ENV: homolog
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL obrigatório}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?DB_HOST obrigatório}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE obrigatório}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME obrigatório}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_STORAGE_LINK: ${RUN_STORAGE_LINK:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - pmed2_app_code_homolog:/var/www/html
    secrets:
      - db_password
    networks:
      - pmed2

  web:
    image: nginx:1.27-alpine
    container_name: pmed2-web-homolog
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - pmed2_app_code_homolog:/var/www/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - pmed2

  queue:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-queue-homolog
    restart: unless-stopped
    user: "0:0"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY obrigatório}
      APP_ENV: homolog
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?DB_HOST obrigatório}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE obrigatório}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME obrigatório}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RUN_MIGRATIONS: "false"
      RUN_STORAGE_LINK: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - pmed2_app_code_homolog:/var/www/html
    secrets:
      - db_password
    networks:
      - pmed2

  scheduler:
    image: ${IMAGE_NAME:-ghcr.io/xlipesousa/pmed2}:${IMAGE_TAG:?IMAGE_TAG obrigatório}
    container_name: pmed2-scheduler-homolog
    restart: unless-stopped
    user: "0:0"
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY obrigatório}
      APP_ENV: homolog
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?DB_HOST obrigatório}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE obrigatório}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME obrigatório}
      DB_PASSWORD_FILE: /run/secrets/db_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_SCHEDULE_TIME: ${BACKUP_SCHEDULE_TIME:-02:00}
      BACKUP_DIR: ${BACKUP_DIR:-/var/www/html/storage/app/backups}
      RUN_MIGRATIONS: "false"
      RUN_STORAGE_LINK: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - pmed2_app_code_homolog:/var/www/html
    secrets:
      - db_password
    networks:
      - pmed2

  redis:
    image: redis:7-alpine
    container_name: pmed2-redis-homolog
    restart: unless-stopped
    volumes:
      - pmed2_redis_homolog:/data
    networks:
      - pmed2

# Rede externa, criada pelo provisionamento (scripts/provisionar-docker-homolog.sh,
# seção 2) ANTES do primeiro deploy: "docker network create --subnet=10.219.10.0/24
# pmed2-homolog-net". Precisa existir de antemão porque o MySQL do host faz bind
# no gateway dessa rede (10.219.10.1) - um IP só passa a existir numa interface
# real quando a rede Docker é criada, e o MySQL não sobe se o bind-address
# apontar para um IP que ainda não existe em nenhuma interface. Se o compose
# criasse essa rede sozinho (no primeiro "up"), o MySQL teria sido configurado
# cedo demais. "external: true" faz o compose REUSAR a rede já criada, em vez de
# tentar criar a dele própria com a mesma subnet (o que Docker recusa - duas
# redes não podem reivindicar a mesma subnet). Ver planos/guia-decisoes-producao.md ADR-08.
networks:
  pmed2:
    external: true
    name: pmed2-homolog-net

volumes:
  pmed2_app_code_homolog:
  pmed2_redis_homolog:

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-/var/www/pmed2/shared/secrets/db_password}
