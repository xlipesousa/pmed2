; Limites de PHP explícitos da imagem PMED2.
;
; Por que este arquivo existe: a imagem base php:8.3-fpm-alpine NÃO ativa nenhum
; php.ini (ela entrega php.ini-production e php.ini-development em
; /usr/local/etc/php/, mas não copia nenhum dos dois para php.ini). Sem este
; arquivo, valem os defaults compilados do PHP - em particular memory_limit=128M.
;
; No modelo bare-metal antigo o php-fpm do host rodava com um limite mais alto,
; ajustado em hotfix depois de /pacotes retornar 500 por estouro de memória em
; produção (ver P-7 em planos/guia-decisoes-producao.md). Migrar para container
; sem declarar o limite reintroduziria exatamente aquele bug.
;
; ATENÇÃO: 512M aqui é MITIGAÇÃO, não correção. A causa real é o
; PacotesController carregar a tabela inteira e filtrar no Blade. Enquanto isso
; não for corrigido, aumentar este valor é o que segura o sintoma.

memory_limit = 512M
